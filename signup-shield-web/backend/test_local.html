<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Signup</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,0.1); width: 420px; }
h2 { margin-bottom: 24px; color: #1a1a2e; }
.form-group { margin-bottom: 16px; }
label { display: block; margin-bottom: 4px; color: #555; font-size: 14px; }
input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; transition: border 0.2s; }
input:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
button { width: 100%; padding: 12px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
button:hover { background: #4338ca; }
.success { background: #d4edda; color: #155724; padding: 12px; border-radius: 8px; margin-bottom: 16px; display: none; }
.error { background: #f8d7da; color: #721c24; padding: 12px; border-radius: 8px; margin-bottom: 16px; display: none; }
</style>
</head>
<body>
<div class="card">
  <h2>Create Account</h2>
  <div class="success" id="success">Account created successfully! Check your email.</div>
  <div class="error" id="error"></div>
  <form id="signupForm">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" name="name" id="name" required>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" id="email" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" id="password" minlength="6" required>
    </div>
    <div class="form-group">
      <label>Phone</label>
      <input type="tel" name="phone" id="phone">
    </div>
    <button type="submit">Sign Up</button>
  </form>
</div>
<script>
const form = document.getElementById('signupForm');
const success = document.getElementById('success');
const error = document.getElementById('error');
form.addEventListener('submit', function(e) {
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const phone = document.getElementById('phone').value.trim();
  if (!name || !email || !password) {
    error.textContent = 'Please fill all required fields';
    error.style.display = 'block';
    success.style.display = 'none';
    return;
  }
  if (password.length < 6) {
    error.textContent = 'Password must be at least 6 characters';
    error.style.display = 'block';
    success.style.display = 'none';
    return;
  }
  // Simulate signup
  success.style.display = 'block';
  error.style.display = 'none';
  form.style.display = 'none';
  console.log('Signup submitted:', { name, email, password, phone });
});
</script>
</body>
</html>
