<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pentaract - Cloud Storage</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh}
.container{max-width:900px;margin:0 auto;padding:20px}
h1{color:#4fc3f7;margin-bottom:20px;font-size:1.8em}
h2{color:#81d4fa;margin:15px 0 10px}
.btn{background:#1565c0;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;margin:4px}
.btn:hover{background:#1976d2}
.btn-danger{background:#c62828}.btn-danger:hover{background:#d32f2f}
.btn-sm{padding:4px 10px;font-size:12px}
input[type=text],input[type=password],input[type=email]{background:#1a1a2e;color:#fff;border:1px solid #333;padding:10px 14px;border-radius:6px;width:100%;margin:6px 0;font-size:14px}
.card{background:#111827;border:1px solid #1f2937;border-radius:10px;padding:20px;margin:15px 0}
.auth-form{max-width:400px;margin:80px auto}
.storage-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#1a1a2e;border-radius:8px;margin:8px 0;cursor:pointer;border:1px solid #333;transition:border .2s}
.storage-item:hover{border-color:#4fc3f7}
.storage-name{font-size:16px;font-weight:600;color:#4fc3f7}
.storage-meta{font-size:12px;color:#888;margin-top:4px}
.file-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#1a1a2e;border-radius:6px;margin:5px 0;border:1px solid #222}
.file-item:hover{border-color:#4fc3f7}
.file-name{color:#e0e0e0;cursor:pointer}
.file-name:hover{color:#4fc3f7}
.file-icon{margin-right:10px;font-size:18px}
.breadcrumb{margin:15px 0;font-size:14px}
.breadcrumb span{color:#4fc3f7;cursor:pointer}
.breadcrumb span:hover{text-decoration:underline}
.breadcrumb .sep{color:#555;margin:0 6px}
.hidden{display:none}
.upload-zone{border:2px dashed #333;border-radius:10px;padding:40px;text-align:center;margin:15px 0;cursor:pointer;transition:border .2s}
.upload-zone:hover{border-color:#4fc3f7}
.upload-zone.dragover{border-color:#4fc3f7;background:#0d1b2a}
.msg{padding:10px 14px;border-radius:6px;margin:10px 0;font-size:14px}
.msg-ok{background:#1b5e20;color:#a5d6a7}
.msg-err{background:#b71c1c;color:#ef9a9a}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #1f2937;margin-bottom:20px}
.topbar .email{color:#888;font-size:13px}
.spinner{display:inline-block;width:20px;height:20px;border:3px solid #333;border-top-color:#4fc3f7;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:999}
.modal{background:#111827;border:1px solid #333;border-radius:12px;padding:24px;width:90%;max-width:400px}
.modal h3{margin-bottom:15px;color:#4fc3f7}
.modal .actions{display:flex;gap:8px;margin-top:15px;justify-content:flex-end}
</style>
</head>
<body>
<div id="app" class="container">
  <!-- LOGIN -->
  <div id="view-login" class="auth-form">
    <div class="card">
      <h1>Pentaract</h1>
      <p style="color:#888;margin-bottom:20px">Cloud Storage</p>
      <div id="login-msg"></div>
      <input type="email" id="login-email" placeholder="Email" value="admin@pentaract.app">
      <input type="password" id="login-pass" placeholder="Password" value="pentaract2024">
      <button class="btn" onclick="doLogin()" style="width:100%;margin-top:10px">Login</button>
    </div>
  </div>

  <!-- MAIN -->
  <div id="view-main" class="hidden">
    <div class="topbar">
      <h1 style="margin:0">Pentaract</h1>
      <div><span class="email" id="user-email"></span> <button class="btn btn-sm" onclick="doLogout()">Logout</button></div>
    </div>

    <!-- Storage List -->
    <div id="storage-list-view">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2>My Storages</h2>
        <button class="btn" onclick="showCreateStorage()">+ New Storage</button>
      </div>
      <div id="storages-container"></div>
    </div>

    <!-- File Browser -->
    <div id="file-browser-view" class="hidden">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <button class="btn btn-sm" onclick="showStorageList()">Back</button>
        <h2 id="current-storage-name"></h2>
      </div>
      <div class="breadcrumb" id="breadcrumb"></div>
      <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()">
        <p>Drop files here or click to upload</p>
        <input type="file" id="file-input" multiple style="display:none" onchange="handleUpload(this.files)">
      </div>
      <div id="files-container"></div>
    </div>
  </div>
</div>

<script>
const API = '';
let token = localStorage.getItem('pentaract_token');
let currentStorage = null;
let currentPath = '';

async function api(method, path, body, isMultipart) {
  const opts = { method, headers: {} };
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  if (body && !isMultipart) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  } else if (body && isMultipart) {
    opts.body = body;
  }
  const res = await fetch(API + path, opts);
  if (res.status === 204) return null;
  const text = await res.text();
  if (!res.ok) throw new Error(text || res.statusText);
  return JSON.parse(text);
}

function show(id) { document.querySelectorAll('[id^="view-"]').forEach(v => v.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
function msg(el, text, ok) { el.innerHTML = '<div class="msg ' + (ok ? 'msg-ok' : 'msg-err') + '">' + text + '</div>'; }

// AUTH
async function doLogin() {
  const email = document.getElementById('login-email').value;
  const pass = document.getElementById('login-pass').value;
  const msgEl = document.getElementById('login-msg');
  try {
    const data = await api('POST', '/api/auth/login', { email, password: pass });
    token = data.access_token;
    localStorage.setItem('pentaract_token', token);
    document.getElementById('user-email').textContent = email;
    show('view-main');
    loadStorages();
  } catch (e) { msg(msgEl, 'Login failed: ' + e.message, false); }
}
function doLogout() { token = null; localStorage.removeItem('pentaract_token'); show('view-login'); }

// STORAGES
async function loadStorages() {
  try {
    const data = await api('GET', '/api/storages');
    const list = data.storages || data || [];
    const c = document.getElementById('storages-container');
    if (!list.length) { c.innerHTML = '<div class="card" style="text-align:center;color:#888">No storages yet. Create one!</div>'; return; }
    c.innerHTML = list.map(s => '<div class="storage-item" onclick="openStorage(\'' + s.id + '\', \'' + s.name + '\')"><div><div class="storage-name">' + s.name + '</div><div class="storage-meta">ID: ' + s.id + '</div></div><button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteStorage(\'' + s.id + '\')">Delete</button></div>').join('');
  } catch (e) { document.getElementById('storages-container').innerHTML = '<div class="msg msg-err">' + e.message + '</div>'; }
}
function showCreateStorage() {
  const name = prompt('Storage name:');
  if (!name) return;
  const chatId = prompt('Chat ID (any number, e.g. 12345):', '1');
  if (chatId === null) return;
  api('POST', '/api/storages', { name, chat_id: parseInt(chatId) }).then(() => loadStorages()).catch(e => alert(e.message));
}
async function deleteStorage(id) {
  if (!confirm('Delete this storage?')) return;
  await api('DELETE', '/api/storages/' + id);
  loadStorages();
}

// FILES
async function openStorage(id, name) {
  currentStorage = id;
  currentPath = '';
  document.getElementById('current-storage-name').textContent = name;
  document.getElementById('storage-list-view').classList.add('hidden');
  document.getElementById('file-browser-view').classList.remove('hidden');
  loadFiles();
}
function showStorageList() {
  document.getElementById('file-browser-view').classList.add('hidden');
  document.getElementById('storage-list-view').classList.remove('hidden');
}
function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  const parts = currentPath ? currentPath.split('/').filter(Boolean) : [];
  let html = '<span onclick="navigateTo(\'\')">Root</span>';
  let acc = '';
  parts.forEach(p => { acc += '/' + p; const path = acc.substring(1); html += '<span class="sep">/</span><span onclick="navigateTo(\'' + path + '\')">' + p + '</span>'; });
  bc.innerHTML = html;
}
function navigateTo(path) { currentPath = path; loadFiles(); }
async function loadFiles() {
  updateBreadcrumb();
  const c = document.getElementById('files-container');
  c.innerHTML = '<div class="spinner"></div>';
  try {
    const treePath = currentPath ? currentPath + '/' : '';
    const data = await api('GET', '/api/storages/' + currentStorage + '/files/tree/' + treePath);
    const items = data || [];
    if (!items.length) { c.innerHTML = '<div style="text-align:center;color:#666;padding:20px">Empty folder</div>'; return; }
    c.innerHTML = items.map(item => {
      if (item.is_dir) {
        return '<div class="file-item"><span class="file-name" onclick="navigateTo(\'' + (currentPath ? currentPath + '/' : '') + item.name + '\')"><span class="file-icon">📁</span>' + item.name + '/</span></div>';
      } else {
        const dlPath = (currentPath ? currentPath + '/' : '') + item.name;
        return '<div class="file-item"><span class="file-name"><span class="file-icon">📄</span>' + item.name + ' <span style="color:#666;font-size:12px">' + (item.size ? formatSize(item.size) : '') + '</span></span><div><a class="btn btn-sm" href="/api/storages/' + currentStorage + '/files/download/' + dlPath + '" target="_blank">Download</a> <button class="btn btn-danger btn-sm" onclick="deleteFile(\'' + dlPath + '\')">Delete</button></div></div>';
      }
    }).join('');
  } catch (e) { c.innerHTML = '<div class="msg msg-err">' + e.message + '</div>'; }
}
async function deleteFile(path) {
  if (!confirm('Delete ' + path + '?')) return;
  await api('DELETE', '/api/storages/' + currentStorage + '/files/' + path);
  loadFiles();
}
function formatSize(b) { if (b < 1024) return b + ' B'; if (b < 1048576) return (b/1024).toFixed(1) + ' KB'; return (b/1048576).toFixed(1) + ' MB'; }

// UPLOAD
async function handleUpload(files) {
  for (const file of files) {
    const fd = new FormData();
    fd.append('file', file);
    fd.append('path', currentPath || '/');
    try { await api('POST', '/api/storages/' + currentStorage + '/files/upload', fd, true); } catch(e) { alert('Upload failed: ' + e.message); }
  }
  loadFiles();
  document.getElementById('file-input').value = '';
}

// DRAG & DROP
const uz = document.getElementById('upload-zone');
uz.addEventListener('dragover', e => { e.preventDefault(); uz.classList.add('dragover'); });
uz.addEventListener('dragleave', () => uz.classList.remove('dragover'));
uz.addEventListener('drop', e => { e.preventDefault(); uz.classList.remove('dragover'); handleUpload(e.dataTransfer.files); });

// INIT
if (token) {
  document.getElementById('user-email').textContent = 'Logged in';
  show('view-main');
  loadStorages();
} else {
  show('view-login');
}
</script>
</body>
</html>
