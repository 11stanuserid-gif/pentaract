name: Kimi 24/7 Keep Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Wake Codespace & Keep Alive
        env:
          GH_TOKEN: ${{ secrets.GH_CODESPACE_TOKEN }}
        run: |
          echo "=== $(date) ==="
          
          # Check codespace state
          STATE=$(curl -s \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/codespaces/turbo-space-enigma-vpv5g6vp6pjxcwg6x" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('state','unknown'))")
          echo "State: $STATE"
          
          # If stopped, start it
          if [ "$STATE" = "Shutdown" ] || [ "$STATE" = "ShuttingDown" ]; then
            echo "Starting codespace..."
            curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/codespaces/turbo-space-enigma-vpv5g6vp6pjxcwg6x/start"
            echo "Waiting 120s for boot..."
            sleep 120
          fi
          
          # SSH in and check services - this counts as activity!
          echo "Checking services..."
          gh codespace ssh -c turbo-space-enigma-vpv5g6vp6pjxcwg6x -- "date && curl -s http://localhost:10000 > /dev/null 2>&1 && echo 'Kimi: UP' || echo 'Kimi: DOWN'"
          
          # Get tunnel URL from logs
          URL=$(gh codespace ssh -c turbo-space-enigma-vpv5g6vp6pjxcwg6x -- \
            "grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log 2>/dev/null | tail -1" 2>/dev/null)
          echo "Tunnel URL: $URL"
          
          # If kimi is down, restart
          KIMI_CHECK=$(gh codespace ssh -c turbo-space-enigma-vpv5g6vp6pjxcwg6x -- \
            "curl -s http://localhost:10000 > /dev/null 2>&1 && echo up || echo down" 2>/dev/null)
          
          if [ "$KIMI_CHECK" = "down" ]; then
            echo "Kimi down! Restarting..."
            gh codespace ssh -c turbo-space-enigma-vpv5g6vp6pjxcwg6x -- \
              "cd /home/codespace && bash start-all.sh"
            sleep 15
            URL=$(gh codespace ssh -c turbo-space-enigma-vpv5g6vp6pjxcwg6x -- \
              "grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log 2>/dev/null | tail -1" 2>/dev/null)
          fi
          
          # If tunnel is down, restart
          if [ -z "$URL" ] || [ "$URL" = "" ]; then
            echo "Tunnel down! Restarting..."
            gh codespace ssh -c turbo-space-enigma-vpv5g6vp6pjxcwg6x -- \
              "pkill -f cloudflared; sleep 2; nohup /home/codespace/cloudflared tunnel --url http://localhost:10000 &>/tmp/tunnel.log &"
            sleep 15
            URL=$(gh codespace ssh -c turbo-space-enigma-vpv5g6vp6pjxcwg6x -- \
              "grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log 2>/dev/null | tail -1" 2>/dev/null)
          fi
          
          echo "Final URL: $URL"
          
          # Write URL to file in repo
          echo "$URL" > docs/tunnel-url.txt
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > docs/tunnel-updated.txt
          
          # Commit and push
          git config user.name "Kimi Bot"
          git config user.email "kimi@bot"
          git add docs/tunnel-url.txt docs/tunnel-updated.txt
          git diff --staged --quiet || git commit -m "Update tunnel URL: $URL" && git push
          
          echo "Done! URL saved to repo."
