name: Codespace + Kimi Keep Alive 24/7

on:
  schedule:
    # Har 3 minute mein
    - cron: '*/3 * * * *'
  workflow_dispatch:  # Manual trigger

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Codespace URL
        run: |
          echo "=== $(date) ==="
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "https://turbo-space-enigma-vpv5g6vp6pjxcwg6x.github.dev" 2>/dev/null)
          echo "Codespace: HTTP $HTTP_CODE"

      - name: Discover Tunnel URL & Ping
        env:
          GH_TOKEN: ${{ secrets.GH_CODESPACE_TOKEN }}
        run: |
          # Discover current tunnel URL from codespace
          TUNNEL_URL=$(GH_TOKEN=${{ secrets.GH_CODESPACE_TOKEN }} \
            gh codespace ssh -c turbo-space-enigma-vpv5g6vp6pjxcwg6x -- \
            "cat /tmp/lt.log 2>/dev/null | grep -oE 'https://[a-z0-9-]+\.loca\.lt' | tail -1" 2>/dev/null)
          echo "Tunnel URL: $TUNNEL_URL"

          if [ -z "$TUNNEL_URL" ]; then
            echo "No tunnel URL found! Restarting codespace..."
            GH_TOKEN=${{ secrets.GH_CODESPACE_TOKEN }} \
              gh codespace restart turbo-space-enigma-vpv5g6vp6pjxcwg6x
            exit 0
          fi

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$TUNNEL_URL" 2>/dev/null)
          echo "Kimi Tunnel: HTTP $HTTP_CODE"

          if [ "$HTTP_CODE" = "503" ] || [ "$HTTP_CODE" = "000" ]; then
            echo "Tunnel down! Restarting localtunnel..."
            GH_TOKEN=${{ secrets.GH_CODESPACE_TOKEN }} \
              gh codespace ssh -c turbo-space-enigma-vpv5g6vp6pjxcwg6x -- \
              "pkill -f 'lt --port' 2>/dev/null; sleep 2; nohup lt --port 10000 > /tmp/lt.log 2>&1 &"
            echo "Tunnel restarted"
          fi

      - name: Restart Codespace if Stopped
        env:
          GH_TOKEN: ${{ secrets.GH_CODESPACE_TOKEN }}
        run: |
          STATE=$(curl -s \
            -H "Authorization: token ${{ secrets.GH_CODESPACE_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/codespaces/turbo-space-enigma-vpv5g6vp6pjxcwg6x" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('state','unknown'))")
          echo "Codespace state: $STATE"

          if [ "$STATE" = "Shutdown" ] || [ "$STATE" = "ShuttingDown" ]; then
            echo "Starting codespace..."
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GH_CODESPACE_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/codespaces/turbo-space-enigma-vpv5g6vp6pjxcwg6x/start"
            echo "Started!"
          fi
