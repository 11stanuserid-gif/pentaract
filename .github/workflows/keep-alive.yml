name: Codespace + Kimi Keep Alive 24/7

on:
  schedule:
    # Har 3 minute mein
    - cron: '*/3 * * * *'
  workflow_dispatch:  # Manual trigger

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Codespace URL
        run: |
          echo "=== $(date) ==="
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "https://turbo-space-enigma-vpv5g6vp6pjxcwg6x.github.dev" 2>/dev/null)
          echo "Codespace: HTTP $HTTP_CODE"

      - name: Ping Kimi Code Tunnel
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "https://nice-guests-cross.loca.lt" 2>/dev/null)
          echo "Kimi Tunnel: HTTP $HTTP_CODE"

          if [ "$HTTP_CODE" = "503" ] || [ "$HTTP_CODE" = "000" ]; then
            echo "Tunnel down! Trying to restart codespace..."
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GH_CODESPACE_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/codespaces/turbo-space-enigma-vpv5g6vp6pjxcwg6x/start"
            echo "Codespace restart triggered"
          fi

      - name: Restart Codespace if Stopped
        env:
          GH_TOKEN: ${{ secrets.GH_CODESPACE_TOKEN }}
        run: |
          STATE=$(curl -s \
            -H "Authorization: token ${{ secrets.GH_CODESPACE_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/codespaces/turbo-space-enigma-vpv5g6vp6pjxcwg6x" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('state','unknown'))")
          echo "Codespace state: $STATE"

          if [ "$STATE" = "Shutdown" ] || [ "$STATE" = "ShuttingDown" ]; then
            echo "Starting codespace..."
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GH_CODESPACE_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/codespaces/turbo-space-enigma-vpv5g6vp6pjxcwg6x/start"
            echo "Started!"
          fi
