name: Kimi Keep Alive
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Kimi Alive
        env:
          GH_TOKEN: ${{ secrets.GH_CODESPACE_TOKEN }}
        run: |
          set +e
          echo "=== $(date) ==="
          STATE=$(curl -s -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/codespaces/turbo-space-enigma-vpv5g6vp6pjxcwg6x" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('state','unknown'))")
          echo "State: $STATE"
          if [ "$STATE" = "Shutdown" ] || [ "$STATE" = "ShuttingDown" ]; then
            curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/codespaces/turbo-space-enigma-vpv5g6vp6pjxcwg6x/start"
            echo "Waiting 120s for boot..."
            sleep 120
          fi
          
          # Git pull latest code on codespace
          gh codespace ssh -c turbo-space-enigma-vpv5g6vp6pjxcwg6x -- "cd /workspaces/pentaract && git pull" 2>&1 || echo "GIT_PULL_FAILED"
          
          # Debug: check what's available
          gh codespace ssh -c turbo-space-enigma-vpv5g6vp6pjxcwg6x -- "ls -la /workspaces/pentaract/start-services.sh; which kimi 2>&1; kimi --version 2>&1; kimi -h 2>&1; echo '==='; kimi run --help 2>&1 || true; echo '==='" 2>&1 || echo "DEBUG_SSH_FAILED"
          
          # Restart services to ensure they run (idempotent)
          gh codespace ssh -c turbo-space-enigma-vpv5g6vp6pjxcwg6x -- "bash /workspaces/pentaract/start-services.sh" 2>&1 || echo "START_FAILED"
          
          # Wait for cloudflared to connect and get URL
          sleep 40
          
          # Get tunnel URL with retry
          URL=""
          for i in 1 2 3; do
            URL=$(gh codespace ssh -c turbo-space-enigma-vpv5g6vp6pjxcwg6x -- "grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel2.log 2>/dev/null | tail -1" 2>&1)
            if [ -n "$URL" ]; then break; fi
            sleep 15
          done
          
          echo "Final URL: $URL"
          
          # Update kimi-code-live dashboard repo
          mkdir -p /tmp/kimi-update/docs
          cd /tmp/kimi-update || exit 1
          rm -rf .git 2>/dev/null
          git clone https://x-access-token:${GH_TOKEN}@github.com/11stanuserid-gif/kimi-code-live.git . 2>/dev/null
          if [ -d .git ]; then
            mkdir -p docs
            echo "$URL" > docs/tunnel-url.txt
            date -u +%Y-%m-%dT%H:%M:%SZ > docs/tunnel-updated.txt
            git config user.name "Bot" && git config user.email "bot@bot"
            git add docs/tunnel-url.txt docs/tunnel-updated.txt
            git diff --cached --quiet || git commit -m "URL update: $(echo $URL | head -c 60)"
            git push 2>/dev/null || echo "PUSH_FAILED"
          else
            echo "CLONE_FAILED"
          fi
          echo "Done!"
