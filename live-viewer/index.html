<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pentaract Live - PostgreSQL Style</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', monospace; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
        
        .header { background: #161b22; padding: 12px 20px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 16px; color: #58a6ff; }
        .status-badge { padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .status-live { background: #238636; color: #fff; animation: pulse 2s infinite; }
        .status-offline { background: #da3633; color: #fff; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        
        .container { padding: 20px; max-width: 1200px; margin: 0 auto; }
        
        .query-section { background: #161b22; border: 1px solid #30363d; border-radius: 6px; margin-bottom: 20px; }
        .query-header { padding: 10px 15px; background: #21262d; border-bottom: 1px solid #30363d; font-size: 12px; color: #8b949e; }
        .query-input { width: 100%; background: transparent; border: none; color: #c9d1d9; font-family: inherit; font-size: 14px; padding: 15px; outline: none; }
        
        .results-section { background: #161b22; border: 1px solid #30363d; border-radius: 6px; overflow: hidden; }
        .results-header { padding: 10px 15px; background: #21262d; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        .results-header .count { color: #58a6ff; font-size: 13px; }
        .results-header .refresh-info { color: #8b949e; font-size: 11px; }
        
        .file-table { width: 100%; border-collapse: collapse; }
        .file-table th { background: #21262d; padding: 10px 15px; text-align: left; font-size: 12px; color: #8b949e; border-bottom: 1px solid #30363d; }
        .file-table td { padding: 10px 15px; border-bottom: 1px solid #21262d; font-size: 13px; }
        .file-table tr:hover { background: #21262d; }
        .file-table tr.new-row { animation: highlight 2s ease-out; }
        @keyframes highlight { from { background: #238636; } to { background: transparent; } }
        
        .file-icon { margin-right: 8px; }
        .file-name { color: #58a6ff; cursor: pointer; }
        .file-name:hover { text-decoration: underline; }
        .file-size { color: #8b949e; }
        .file-date { color: #6e7681; font-size: 12px; }
        
        .status-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #161b22; border-top: 1px solid #30363d; padding: 8px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
        .status-bar .left { color: #8b949e; }
        .status-bar .right { color: #58a6ff; }
        
        .log-section { margin-top: 20px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; }
        .log-header { padding: 10px 15px; background: #21262d; border-bottom: 1px solid #30363d; font-size: 12px; color: #8b949e; }
        .log-content { padding: 10px; max-height: 150px; overflow-y: auto; font-size: 11px; }
        .log-entry { margin-bottom: 3px; }
        .log-entry.success { color: #3fb950; }
        .log-entry.error { color: #f85149; }
        .log-entry.info { color: #8b949e; }
        
        .empty-state { text-align: center; padding: 40px; color: #6e7681; }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ PENTARACT LIVE — PostgreSQL Style</h1>
        <span class="status-badge status-offline" id="statusBadge">CONNECTING</span>
    </div>
    
    <div class="container">
        <div class="query-section">
            <div class="query-header">▶ SQL QUERY CONSOLE</div>
            <input type="text" class="query-input" id="queryInput" 
                   placeholder="SELECT * FROM pentaract.files ORDER BY created_at DESC;" readonly>
        </div>
        
        <div class="results-section">
            <div class="results-header">
                <span class="count" id="fileCount">0 rows</span>
                <span class="refresh-info" id="refreshInfo">Real-time via WebSocket</span>
            </div>
            <table class="file-table">
                <thead>
                    <tr>
                        <th>STATUS</th>
                        <th>NAME</th>
                        <th>SIZE</th>
                        <th>TYPE</th>
                        <th>LAST MODIFIED</th>
                    </tr>
                </thead>
                <tbody id="fileTableBody">
                    <tr><td colspan="5" class="empty-state">Connecting to database...</td></tr>
                </tbody>
            </table>
        </div>
        
        <div class="log-section">
            <div class="query-header">▶ ACTIVITY LOG</div>
            <div class="log-content" id="logContent"></div>
        </div>
    </div>
    
    <div class="status-bar">
        <div class="left">
            <span id="connectionType">WebSocket</span> | 
            Latency: <span id="latency">--</span>ms |
            Last update: <span id="lastUpdate">--</span>
        </div>
        <div class="right">Pentaract PostgreSQL Gateway v1.0</div>
    </div>

    <script>
        let ws = null;
        let lastPing = 0;
        let fileCache = [];
        
        function log(msg, type = 'info') {
            const el = document.getElementById('logContent');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            el.appendChild(entry);
            el.scrollTop = el.scrollHeight;
        }
        
        function setStatus(online) {
            const badge = document.getElementById('statusBadge');
            if (online) {
                badge.textContent = '● LIVE';
                badge.className = 'status-badge status-live';
            } else {
                badge.textContent = '● OFFLINE';
                badge.className = 'status-badge status-offline';
            }
        }
        
        function formatSize(bytes) {
            if (!bytes) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        function getFileType(name) {
            if (!name) return 'unknown';
            const ext = name.split('.').pop().toLowerCase();
            const types = { 'txt': 'text', 'json': 'data', 'py': 'python', 'js': 'javascript', 'sh': 'script', 'jpg': 'image', 'png': 'image' };
            return types[ext] || ext;
        }
        
        function renderFiles(files) {
            const tbody = document.getElementById('fileTableBody');
            const countEl = document.getElementById('fileCount');
            
            if (!files || files.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No files in database</td></tr>';
                countEl.textContent = '0 rows';
                return;
            }
            
            // Detect new files
            const oldNames = fileCache.map(f => f.name);
            fileCache = files;
            
            countEl.textContent = `${files.length} rows`;
            
            tbody.innerHTML = files.map((f, i) => {
                const isNew = !oldNames.includes(f.name) && oldNames.length > 0;
                return `
                    <tr class="${isNew ? 'new-row' : ''}">
                        <td>${isNew ? '🟢 NEW' : '✅'}</td>
                        <td class="file-name" onclick="downloadFile('${f.id}')">📄 ${f.name || f.path || 'unnamed'}</td>
                        <td class="file-size">${formatSize(f.size)}</td>
                        <td>${getFileType(f.name)}</td>
                        <td class="file-date">${f.created_at ? new Date(f.created_at).toLocaleString() : '--'}</td>
                    </tr>
                `;
            }).join('');
        }
        
        function downloadFile(id) {
            // Trigger download via API
            log(`Downloading file: ${id}`);
        }
        
        function connectWebSocket() {
            const wsUrl = `ws://${window.location.hostname}:8081`;
            log(`Connecting to WebSocket: ${wsUrl}`);
            
            try {
                ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    log('WebSocket connected — Real-time sync active', 'success');
                    setStatus(true);
                    document.getElementById('connectionType').textContent = 'WebSocket';
                };
                
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'initial_data' || data.type === 'data_changed') {
                        renderFiles(data.files);
                        document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
                        if (data.type === 'data_changed') {
                            log('📡 Data changed — Table updated instantly', 'success');
                        }
                    } else if (data.type === 'heartbeat') {
                        // Calculate latency
                        const latency = Date.now() - lastPing;
                        document.getElementById('latency').textContent = latency;
                    }
                };
                
                ws.onclose = () => {
                    log('WebSocket disconnected — Reconnecting...', 'error');
                    setStatus(false);
                    setTimeout(connectWebSocket, 3000);
                };
                
                ws.onerror = (err) => {
                    log('WebSocket error — Falling back to polling', 'error');
                    startPolling();
                };
            } catch (e) {
                log('WebSocket failed — Using HTTP polling', 'error');
                startPolling();
            }
        }
        
        function startPolling() {
            document.getElementById('connectionType').textContent = 'HTTP Polling';
            log('Starting HTTP polling mode (5s interval)');
            
            setInterval(async () => {
                lastPing = Date.now();
                try {
                    const res = await fetch('/api/storages');
                    const data = await res.json();
                    if (data.storages && data.storages[0]) {
                        const filesRes = await fetch(`/api/storages/${data.storages[0].id}/files`);
                        const filesData = await filesRes.json();
                        renderFiles(filesData.files || []);
                        document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
                        setStatus(true);
                    }
                } catch (e) {
                    setStatus(false);
                }
            }, 5000);
        }
        
        // Initialize
        log('Pentaract Live Viewer initialized');
        log('Mode: Real-time PostgreSQL-style display');
        connectWebSocket();
    </script>
</body>
</html>
