<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimi Code - Always Ready</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:#0a0a1a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
        .c{text-align:center;max-width:600px;width:100%}
        h1{font-size:2.4rem;margin-bottom:.2rem;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .sub{color:#888;margin-bottom:1.5rem;font-size:1rem}
        .box{background:#1a1a2e;border-radius:16px;padding:2rem;margin-bottom:1.5rem;border:1px solid #333}
        .st{font-size:1.2rem;margin-bottom:1rem;color:#ffaa00}
        .st.ok{color:#00ff88}
        .st.err{color:#ff4444}
        .st.loading{color:#ffaa00}
        .btn{padding:16px 40px;border:none;border-radius:10px;font-size:1.1rem;cursor:pointer;font-weight:bold;transition:all .3s;display:inline-block;text-decoration:none}
        .btn1{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
        .btn1:hover{transform:scale(1.05);box-shadow:0 0 25px rgba(102,126,234,.5)}
        .btn1:disabled{opacity:.5;cursor:not-allowed;transform:none}
        .btn2{background:#00ff88;color:#000;margin-top:1rem}
        .btn2:hover{box-shadow:0 0 25px rgba(0,255,136,.4)}
        .spin{border:3px solid #333;border-top:3px solid #667eea;border-radius:50%;width:36px;height:36px;animation:sp 1s linear infinite;margin:1.5rem auto}
        @keyframes sp{to{transform:rotate(360deg)}}
        .url-box{background:#0d1117;padding:1.2rem;border-radius:10px;word-break:break-all;font-family:monospace;font-size:.9rem;color:#58a6ff;margin:1.2rem 0;border:1px solid #333}
        .url-box a{color:#58a6ff;text-decoration:none}
        .url-box a:hover{text-decoration:underline}
        .status-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
        .dot-green{background:#00ff88;box-shadow:0 0 8px #00ff88}
        .dot-red{background:#ff4444;box-shadow:0 0 8px #ff4444}
        .dot-yellow{background:#ffaa00;animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
        .timer{font-size:.8rem;color:#555;margin-top:.5rem}
        .info{font-size:.8rem;color:#555;margin-top:1.5rem}
        .info a{color:#667eea}
        .auto-badge{display:inline-block;background:#1a3a1a;color:#00ff88;padding:4px 12px;border-radius:20px;font-size:.75rem;margin-bottom:1rem;border:1px solid #00ff8833}
        .countdown{font-size:.85rem;color:#667eea;margin-top:.5rem}
    </style>
</head>
<body>
<div class="c">
    <h1>🧠 Kimi Code</h1>
    <p class="sub">AI Coding Assistant - 24/7 Live</p>
    <div class="auto-badge">🔄 Auto-refresh ON (every 20s)</div>
    
    <div class="box">
        <div id="st" class="st loading">
            <span class="status-dot dot-yellow"></span>Checking Kimi Code...
        </div>
        <div id="spinner" class="spin"></div>
        <div id="urlBox" class="url-box" style="display:none"></div>
        <div id="actions" style="display:none">
            <a id="openBtn" href="#" target="_blank" class="btn btn1">🚀 Open Kimi Code</a>
        </div>
        <div id="autoMsg" style="display:none;color:#00ff88;font-size:.95rem;margin-top:1rem">
            ⚡ Kimi Code is live! Opening automatically...
        </div>
        <div id="countdown" class="countdown" style="display:none"></div>
    </div>

    <div class="box" style="padding:1rem">
        <p style="color:#666;font-size:.8rem">
            Status checks: <span id="checkCount">0</span> | 
            Last check: <span id="lastCheck">-</span>
        </p>
    </div>
    
    <p class="info">
        Bookmark this page! <b>URL never changes.</b><br>
        Kimi Code auto-starts if down. Just keep this page open.
    </p>
</div>

<script>
const REPO = "11stanuserid-gif/pentaract";
const RAW_URL = `https://raw.githubusercontent.com/${REPO}/main/docs/tunnel-url.txt`;
const UPDATED_URL = `https://raw.githubusercontent.com/${REPO}/main/docs/tunnel-updated.txt`;
let checks = 0;
let currentUrl = null;
let autoOpened = false;

function setStatus(msg, cls) {
    const el = document.getElementById('st');
    el.className = 'st ' + cls;
    el.innerHTML = `<span class="status-dot dot-${cls === 'ok' ? 'green' : cls === 'err' ? 'red' : 'yellow'}"></span>${msg}`;
}

function showSpinner(show) {
    document.getElementById('spinner').style.display = show ? 'block' : 'none';
}

function showUrl(url) {
    const box = document.getElementById('urlBox');
    box.style.display = 'block';
    box.innerHTML = `<a href="${url}" target="_blank">${url}</a>`;
    
    const btn = document.getElementById('openBtn');
    btn.href = url;
    document.getElementById('actions').style.display = 'block';
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('countdown').style.display = 'none';
}

async function checkStatus() {
    checks++;
    document.getElementById('checkCount').textContent = checks;
    document.getElementById('lastCheck').textContent = new Date().toLocaleTimeString();
    
    try {
        // Check if tunnel URL file exists and is fresh
        const updatedResp = await fetch(UPDATED_URL + '?t=' + Date.now());
        if (updatedResp.ok) {
            const updatedAt = (await updatedResp.text()).trim();
            const age = (Date.now() - new Date(updatedAt).getTime()) / 1000 / 60;
            
            if (age > 10) {
                // URL is stale (>10 min old), Kimi might be down
                setStatus('Kimi Code might be sleeping... Starting it!', 'loading');
                showSpinner(true);
                await triggerWorkflow();
                showAutoRestartMsg();
                return;
            }
        }
        
        // Get tunnel URL
        const urlResp = await fetch(RAW_URL + '?t=' + Date.now());
        if (urlResp.ok) {
            const url = (await urlResp.text()).trim();
            if (url && url.includes('trycloudflare.com')) {
                // Verify the tunnel is actually accessible
                setStatus('✅ Kimi Code is LIVE!', 'ok');
                showUrl(url);
                currentUrl = url;
                autoOpened = false;
                
                // Auto-open in new tab on first detection
                if (!autoOpened && checks > 1) {
                    autoOpened = true;
                    document.getElementById('autoMsg').style.display = 'block';
                    // Don't auto-open, just show the button prominently
                }
                return;
            }
        }
        
        // No valid URL found
        setStatus('Kimi Code is starting...', 'loading');
        showSpinner(true);
        document.getElementById('urlBox').style.display = 'none';
        document.getElementById('actions').style.display = 'none';
        
    } catch(e) {
        console.error('Check error:', e);
        setStatus('Checking...', 'loading');
        showSpinner(true);
    }
}

async function triggerWorkflow() {
    try {
        const r = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/keep-alive.yml/dispatches`, {
            method: 'POST',
            headers: { 'Accept': 'application/vnd.github+json' },
            body: JSON.stringify({ ref: 'main' })
        });
        console.log('Workflow triggered:', r.status);
        return r.status === 204;
    } catch(e) {
        console.error('Trigger error:', e);
        return false;
    }
}

function showAutoRestartMsg() {
    document.getElementById('urlBox').style.display = 'none';
    document.getElementById('actions').style.display = 'none';
    
    let remaining = 60;
    const el = document.getElementById('countdown');
    el.style.display = 'block';
    
    const timer = setInterval(() => {
        remaining--;
        el.textContent = `⏱ Kimi Code starting... ~${remaining}s remaining`;
        if (remaining <= 0) {
            clearInterval(timer);
            el.textContent = '🔄 Refreshing...';
            location.reload();
        }
    }, 1000);
}

// Start auto-checking
checkStatus();
setInterval(checkStatus, 20000); // Check every 20 seconds
document.getElementById('countdown').style.display = 'none';
</script>
</body>
</html>
